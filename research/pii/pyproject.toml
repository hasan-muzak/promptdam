[project]
name = "pii-bakeoff"
version = "0.1.0"
description = "Bake-off of small PII detectors for Promptdam's firewall: accuracy per language and CPU cost"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.8",
    "transformers>=5.2",
    "huggingface_hub>=0.34",
    "pyarrow>=17",
    "onnxruntime>=1.22",
    "gliner2",
    "accelerate>=1.1",
    "onnx>=1.23.2",
]

[tool.uv]
package = false
