# Promptdam tasks: `task <name>` here, or `task promptdam:<name>` from the keel
# workspace root. Tasks read Promptdam's .env one by one: an included Taskfile
# can't declare a Taskfile-wide dotenv.
version: "3"

vars:
  # Promptdam's own local stack (infra/compose/product.yaml), never shared
  # with another product.
  STACK: docker compose -f ../../../infra/compose/product.yaml -p promptdam --env-file stack.env

tasks:
  setup:
    desc: Create Promptdam's .env from the template
    cmds:
      - test -f .env || cp .env.example .env

  dev:stack:
    desc: Start Promptdam's own Postgres, Valkey, ClickHouse, S3, Mailpit and stripe-mock and wait until healthy
    cmds:
      - "{{.STACK}} up -d --wait"

  dev:stack:down:
    desc: Stop Promptdam's stack, keeping its data
    cmds:
      - "{{.STACK}} down"

  dev:stack:reset:
    desc: Stop Promptdam's stack and delete all of its data
    prompt: This deletes Promptdam's local databases, bucket and queues. Continue?
    cmds:
      - "{{.STACK}} down -v"

  migrate:
    desc: Apply Promptdam's Postgres and ClickHouse migrations (core, River, product graph)
    dotenv: [".env"]
    cmds:
      - go run ./server/cmd/migrate

  migration:
    desc: "Author a Postgres migration from the Ent schema with Atlas (task promptdam:migration -- <name>; needs Docker)"
    cmds:
      - atlas migrate diff {{.CLI_ARGS}} --dir "file://server/migrations/postgres?format=goose" --to "ent://server/ent/schema" --dev-url "docker://postgres/18/dev?search_path=public"

  dev:idenzy:
    desc: Create Promptdam's local Idenzy project and write its keys to .env (Idenzy runs with `task dev:idenzy` in keel)
    dir: ../../..
    cmds:
      - infra/idenzy/project.sh products/promptdam/promptdam promptdam

  dev:api:
    desc: Run Promptdam's API on :8281 (needs `task promptdam:dev:stack`)
    dotenv: [".env"]
    cmds:
      - go run ./server/cmd/api

  dev:gateway:
    desc: Run Promptdam's gateway data plane on :8282 (clients' base URL is http://localhost:8282/v1)
    dotenv: [".env"]
    cmds:
      - go run ./server/cmd/gateway

  dev:worker:
    desc: Run Promptdam's job worker
    dotenv: [".env"]
    cmds:
      - KEEL_ADDR=:8291 go run ./server/cmd/worker

  dev:fake:
    desc: Run a fake LLM provider on :8299 (OpenAI and Anthropic APIs) for local calls and load tests
    cmds:
      - go run ./bench/cmd/fake-upstream {{.CLI_ARGS}}

  dev:seed:
    desc: Create an organization, a project, a gateway key and providers at the fake provider, and print how to call them
    dotenv: [".env"]
    cmds:
      - go run ./server/cmd/api dev seed {{.CLI_ARGS}}

  stripe:sync:
    desc: Create Promptdam's Stripe products, prices and meters (test keys in .env)
    dotenv: [".env"]
    cmds:
      - go run ./server/cmd/api stripe sync

  catalog:export:
    desc: Write the public catalog for the pricing page
    cmds:
      - go run ./server/cmd/api catalog export web/site/catalog.json

  test:
    desc: Run Promptdam's Go tests against its own stack
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:25432/keel_test?sslmode=disable
      KEEL_TEST_VALKEY_URL: redis://localhost:26379/15
      KEEL_TEST_CLICKHOUSE_URL: clickhouse://keel:keel@localhost:29000/keel_test
      KEEL_TEST_S3_ENDPOINT: http://localhost:29100
      KEEL_TEST_SMTP_URL: smtp://localhost:21025
      KEEL_TEST_MAILPIT_URL: http://localhost:28025
      KEEL_TEST_STRIPE_MOCK_URL: http://localhost:22111
    cmds:
      - go test -race ./server/... ./bench/...

  demo:customs:
    desc: "A customs broker's long conversation through a Claude router on PROMPTDAM_TEST_ANTHROPIC_KEY (.env), then the gateway's ledger (about $0.15, stops past $0.50)"
    dotenv: [".env"]
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:25432/keel_test?sslmode=disable
      KEEL_TEST_VALKEY_URL: redis://localhost:26379/15
      KEEL_TEST_CLICKHOUSE_URL: clickhouse://keel:keel@localhost:29000/keel_test
      KEEL_TEST_S3_ENDPOINT: http://localhost:29100
    cmds:
      - go test ./server/livecheck -run TestCustomsBroker -v -count=1 -timeout 20m

  demo:clouds:
    desc: "Claude and each cloud's own models through Bedrock, Vertex and Azure providers, on the test accounts in .env (PROMPTDAM_TEST_BEDROCK_*, _VERTEX_*, _AZURE_*; a cloud without them is skipped): a few cents, stops past $0.25"
    dotenv: [".env"]
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:25432/keel_test?sslmode=disable
      KEEL_TEST_VALKEY_URL: redis://localhost:26379/15
      KEEL_TEST_CLICKHOUSE_URL: clickhouse://keel:keel@localhost:29000/keel_test
      KEEL_TEST_S3_ENDPOINT: http://localhost:29100
    cmds:
      - go test ./server/livecheck -run TestClouds -v -count=1 -timeout 10m

  demo:doors:
    desc: "Google's genai and AWS's bedrockruntime SDKs through the Gemini and Bedrock doors, on PROMPTDAM_TEST_ANTHROPIC_KEY and PROMPTDAM_TEST_OPENROUTER_KEY (.env): Gemini and Claude, streamed, tools, a router, counts (a cent or two, stops past $0.10)"
    dotenv: [".env"]
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:25432/keel_test?sslmode=disable
      KEEL_TEST_VALKEY_URL: redis://localhost:26379/15
      KEEL_TEST_CLICKHOUSE_URL: clickhouse://keel:keel@localhost:29000/keel_test
      KEEL_TEST_S3_ENDPOINT: http://localhost:29100
    cmds:
      - go test ./server/livecheck -run TestDoors -v -count=1 -timeout 10m

  demo:claudecode:
    desc: "Claude Code (the claude CLI on PATH) fixes a small Go repository on PROMPTDAM_TEST_ANTHROPIC_KEY (.env), straight to Anthropic and through the gateway with the firewall off, at its defaults and redacting secrets; then the ledger beside what Claude Code says it spent (a dollar or two, stops past $3)"
    dotenv: [".env"]
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:25432/keel_test?sslmode=disable
      KEEL_TEST_VALKEY_URL: redis://localhost:26379/15
      KEEL_TEST_CLICKHOUSE_URL: clickhouse://keel:keel@localhost:29000/keel_test
      KEEL_TEST_S3_ENDPOINT: http://localhost:29100
    cmds:
      - go test ./server/livecheck -run TestClaudeCode -v -count=1 -timeout 40m

  demo:traffic:
    desc: "Ten users chatting with the customs assistant at once, paced like people (breaks past the 5-minute cache), on PROMPTDAM_TEST_ANTHROPIC_KEY (.env), then the ledger (about $1 and 30 minutes, stops past $3)"
    dotenv: [".env"]
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:25432/keel_test?sslmode=disable
      KEEL_TEST_VALKEY_URL: redis://localhost:26379/15
      KEEL_TEST_CLICKHOUSE_URL: clickhouse://keel:keel@localhost:29000/keel_test
      KEEL_TEST_S3_ENDPOINT: http://localhost:29100
    cmds:
      - go test ./server/livecheck -run TestCustomsTraffic -v -count=1 -timeout 90m

  bench:
    desc: "Measure the gateway's overhead against a fake provider (S0 exit: p99 within 40 ms), then its own cost per call"
    cmds:
      - PROMPTDAM_BENCH=1 go test ./bench/ -run TestOverheadBudget -v -count=1
      - go test ./bench/ ./server/features/gateway/ -run '^$' -bench . -benchmem
